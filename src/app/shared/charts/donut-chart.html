<div class="donut">
  <svg viewBox="0 0 100 100" role="img" [attr.aria-label]="summary()">
    <circle class="donut__track" cx="50" cy="50" r="38" pathLength="100" />
    <g class="donut__arcs" transform="rotate(-90 50 50)">
      @for (a of arcs(); track a.slice.id) {
        <circle
          class="donut__arc"
          [class.is-active]="active() === a.slice.id"
          [class.is-dim]="active() !== null && active() !== a.slice.id"
          cx="50"
          cy="50"
          r="38"
          pathLength="100"
          [attr.stroke]="a.slice.color"
          [style.stroke-dasharray]="drawn() ? a.length + ' ' + (100 - a.length) : '0 100'"
          [style.stroke-dashoffset]="-(a.offset + 0.45)"
          (pointerenter)="active.set(a.slice.id)"
          (pointerleave)="active.set(null)"
        />
      }
    </g>
  </svg>
  <div class="donut__centre" aria-hidden="true">
    @if (focus(); as f) {
      <span class="donut__label">{{ f.slice.label }}</span>
      <span class="donut__value num">{{ f.percent.toFixed(1) }}%</span>
    } @else {
      <span class="donut__label">{{ centreLabel() }}</span>
      <span class="donut__value num">{{ centreValue() }}</span>
    }
  </div>
</div>
