<section class="wrap eng" aria-labelledby="eng-h">
  <div class="eng__text">
    <h2 id="eng-h" class="h" aria-label="One engine behind every number">
      @for (w of headWords; track $index) {
        <span class="w" aria-hidden="true" [style.--w]="$index">{{ w }}</span
        >{{ ' ' }}
      }
    </h2>
    <p>
      Every calculator keeps its maths in one plain function that is tested on its own. The figure,
      the chart, the table and the worked example all read from it, so they always agree.
    </p>
  </div>

  <figure class="flow">
    <figcaption class="flow__cap">
      <mat-icon aria-hidden="true" fontIcon="lock" />
      Runs in your browser. Nothing you type is uploaded.
    </figcaption>

    <div class="map">
      <app-calc-chips />

      <span class="link" aria-hidden="true"
        ><span class="link__t label">typed or dragged</span><i></i
      ></span>
      <app-engine-fan flow="in" [rows]="count" label="what you type" aria-hidden="true" />

      <div class="node node--engine">
        <p class="label">The engine</p>
        <h3>The maths</h3>
        <p class="muted">
          {{ count }} calculators, {{ count }} engines, one shape. The same numbers in give the same
          answer out, every time.
        </p>
      </div>

      <span class="link" aria-hidden="true"
        ><span class="link__t label">the same result</span><i></i
      ></span>
      <app-engine-fan flow="out" [rows]="3" label="the same result" aria-hidden="true" />

      <ul class="outs">
        <li class="node out">
          <h3>Figure and chart</h3>
          <p class="out__row">
            <span class="muted">The answer, and a picture of it.</span>
            <app-tile-visual [spec]="split" />
          </p>
        </li>
        <li class="node out">
          <h3>Table of working</h3>
          <p class="out__row">
            <span class="muted">Year by year, or step by step.</span>
            <span class="rows" aria-hidden="true"><i></i><i></i><i></i></span>
          </p>
        </li>
        <li class="node out">
          <h3>Worked example</h3>
          <p class="formula num">{{ formula }}</p>
          <p class="muted">Your own numbers, line by line.</p>
        </li>
      </ul>
    </div>
  </figure>
</section>
