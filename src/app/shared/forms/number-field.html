<div class="nf">
  <div class="nf__row">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="nf__field">
    <mat-label>{{ label() }}</mat-label>
    @if (prefix()) {
      <span matTextPrefix class="nf__affix">{{ prefix() }}&nbsp;</span>
    }
    <input
      matInput
      class="num"
      type="text"
      autocomplete="off"
      spellcheck="false"
      [attr.inputmode]="inputmode()"
      [id]="inputId"
      [formControl]="control"
      [errorStateMatcher]="matcher"
      (focus)="onFocus($event)"
      (mouseup)="onMouseUp($event)"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
    @if (suffix()) {
      <span matTextSuffix class="nf__affix">&nbsp;{{ suffix() }}</span>
    }
    @if (error()) {
      <mat-error>{{ error() }}</mat-error>
    } @else if (hint()) {
      <mat-hint>{{ hint() }}</mat-hint>
    }
  </mat-form-field>
  <ng-content />
  </div>

  @if (slider()) {
    <mat-slider class="nf__slider" [min]="min()" [max]="max()" [step]="step()">
      <input matSliderThumb [attr.aria-label]="label()" [value]="value()" (valueChange)="onSlider($event)" />
    </mat-slider>
    @if (minLabel() || maxLabel()) {
      <div class="nf__range" aria-hidden="true">
        <span>{{ minLabel() }}</span>
        <span>{{ maxLabel() }}</span>
      </div>
    }
  }
</div>
