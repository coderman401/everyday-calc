# Builds the site and publishes it to GitHub Pages.
#
# One-time set-up: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
# After that, every push to main deploys; it can also be run by hand from the Actions tab.
# The site is served at https://<owner>.github.io/<repo>/ (or your custom domain, if you add one).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one still waiting, but never cancels one in flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Gives the public address and the path the site is served from ("" for a custom domain or a
      # <owner>.github.io repository, "/<repo>" for a project site)
      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      # A failing test stops the deploy
      - run: npx ng test --watch=false

      # The canonical and social URLs in every page, and robots.txt, sitemap.xml and llms.txt, all read
      # the address in site.json. Point it at the Pages address for this build (nothing is committed).
      - name: Use the Pages address as the site address
        run: |
          node -e "const fs=require('fs'),f='src/app/core/seo/site.json',j=JSON.parse(fs.readFileSync(f,'utf8'));j.url=process.env.SITE_URL.replace(/\/+\$/,'');fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          npm run seo
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      # --base-href makes every asset and route resolve under /<repo>/
      - name: Build
        run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      # Unknown addresses get 404.html (a real 404 status on Pages), which boots the app's "not here" page
      - name: Add the 404 page
        run: node scripts/post-build.mjs

      # Pages runs Jekyll unless told not to; the app has no Jekyll content
      - run: touch dist/calculators/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/calculators/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
