# Builds the site and publishes it to GitHub Pages.
#
# One-time set-up: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
# After that, every push to main deploys; it can also be run by hand from the Actions tab.
# The site is served at https://<owner>.github.io/<repo>/ (or your custom domain, if you add one).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one still waiting, but never cancels one in flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Gives the public address and the path the site is served from ("" for a custom domain or a
      # <owner>.github.io repository, "/<repo>" for a project site)
      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      # A failing test stops the deploy
      - run: npx ng test --watch=false

      # Assets and routes resolve under the Pages base path. Canonicals come from site.json.
      - name: Build mirror
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href "${BASE_PATH}/"

      # Publish the sitemap on the canonical host.
      - run: rm dist/calculators/browser/sitemap.xml

      # Pages runs Jekyll unless told not to; the app has no Jekyll content
      - run: touch dist/calculators/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/calculators/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
